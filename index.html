<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Câmera Instantânea + Temporizador de Exclusão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="iphone">
    <div id="flash"></div>
    
    <!-- Toast flutuante -->
    <div id="toastMsg" class="toast-msg" style="opacity:0;"></div>

    <canvas id="canvas"></canvas>

    <div id="galleryOverlay">
        <button class="close-gallery" id="closeGalleryBtn">✕</button>
        <div id="currentPhoto"></div>
        
        <!-- Área principal: tempo restante para exclusão -->
        <div id="expiryInfo" class="expiry-badge">⏳ Carregando...</div>
        
        <div class="gallery-nav">
            <button class="nav-btn" id="prevPhotoBtn">◀</button>
            <span id="photoCounter" class="photo-counter">0 / 0</span>
            <button class="nav-btn" id="nextPhotoBtn">▶</button>
        </div>
        <div class="delete-photo-btn" id="deletePhotoBtn">🗑️ Excluir esta foto</div>
    </div>

    <div class="top-nav">
        <span data-setting="HDR">HDR</span>
        <span data-setting="Auto">Auto</span>
        <span data-setting="On" class="active-yellow">On</span>
        <span data-setting="Off">Off</span>
    </div>

    <div class="camera-view">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="mode-selector">
        <span class="mode" data-mode="VIDEO">VIDEO</span>
        <span class="mode selected" data-mode="PHOTO">PHOTO</span>
        <span class="mode" data-mode="TEMP">TEMP</span>
        <span class="mode" data-mode="SQUARE">SQUARE</span>
        <span class="mode" data-mode="PANO">PANO</span>
    </div>

    <div id="tempOptions" style="display:none;">
        <span>⏱️ Após este tempo, foto some:</span>
        <select id="tempTime">
            <option value="60000">1 minuto</option>
            <option value="3600000">1 hora</option>
            <option value="86400000">24 horas</option>
            <option value="172800000">48 horas</option>
            <option value="2592000000">1 mês</option>
            <option value="7776000000">3 meses</option>
            <option value="15552000000">6 meses</option>
        </select>
    </div>

    <div class="shutter-area">
        <div id="galleryPreview" class="gallery-preview"></div>
        <div class="shutter-btn" id="shutter"></div>
        <div class="flip-btn" id="flipBtn">🔄</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
