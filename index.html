<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vivo V40 - Câmera Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="smartphone-vivo">
    <div class="camera-punch"></div>
    <div id="flash"></div>
    <div id="toastMsg" class="toast-msg" style="opacity:0;"></div>
    <canvas id="canvas"></canvas>

    <div id="galleryOverlay">
        <button class="close-gallery" id="closeGalleryBtn">✕</button>
        <div id="currentPhoto"></div>
        <div id="expiryInfo" class="expiry-badge">⏳ Carregando...</div>
        <div class="gallery-nav">
            <button class="nav-btn" id="prevPhotoBtn">◀</button>
            <span id="photoCounter" class="photo-counter">0 / 0</span>
            <button class="nav-btn" id="nextPhotoBtn">▶</button>
        </div>
        <div class="delete-photo-btn" id="deletePhotoBtn">🗑️ Excluir esta foto</div>
    </div>

    <div class="top-nav">
        <span class="nav-item" data-setting="HDR">HDR</span>
        <span class="nav-item zeiss-brand" data-setting="ZEISS">ZEISS</span>
        <span class="nav-item" data-setting="Auto">Auto</span>
        <span class="nav-item active" data-setting="On">On</span>
    </div>

    <div class="camera-view">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="tempOptions" style="display:none;">
        <span>⏱️ Expiração:</span>
        <select id="tempTime">
            <option value="60000">1 minuto</option>
            <option value="3600000">1 hora</option>
            <option value="86400000">24 horas</option>
            <option value="2592000000">1 mês</option>
        </select>
    </div>

    <div class="mode-selector">
        <div class="mode-track">
            <span class="mode" data-mode="NIGHT">NOITE</span>
            <span class="mode" data-mode="PORTRAIT">RETRATO</span>
            <span class="mode selected" data-mode="PHOTO">FOTO</span>
            <span class="mode" data-mode="VIDEO">VÍDEO</span>
            <span class="mode" data-mode="TEMP">TEMP</span>
        </div>
    </div>

    <div class="shutter-area">
        <div id="galleryPreview" class="gallery-preview"></div>
        <div class="shutter-btn-container">
            <div class="shutter-btn" id="shutter"></div>
        </div>
        <div class="flip-btn" id="flipBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path d="M17 4l-1.4 1.4 1.6 1.6h-7.2c-2.2 0-4 1.8-4 4v2h2v-2c0-1.1.9-2 2-2h7.2l-1.6 1.6 1.4 1.4 4-4-4-4zM7 20l1.4-1.4-1.6-1.6h7.2c2.2 0 4-1.8 4-4v-2h-2v2c0 1.1-.9 2-2 2h-7.2l1.6-1.6-1.4-1.4-4 4 4 4z"/>
            </svg>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
